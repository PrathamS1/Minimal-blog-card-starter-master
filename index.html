<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <title>devChallenges.io | Minimal Blog Card</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .author-info {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 10px;
        font-size: 14px;
        text-align: center;
        margin-top: 16px;
        color: rgb(55, 65, 81);
      }

      .author-info a {
        text-decoration: none;
      }
    </style>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="author-info">
      Coded by <a href="#">Pratham Singh</a> | Challenge by
      <a
        href="https://www.devchallenges.io?ref=challenge"
        rel="noopener"
        target="_blank"
        >devChallenges.io</a
      >
    </div>
    <div class="container">
      <div class="card-container">
        <img src="./resources/Cactus.jpg" class="image" alt="" />
        <div class="capsule">Design</div>
        <div class="card-content">
          <h2 class="card-title">Embracing Minimalism</h2>
          <div class="card-desc">
            From minimalist sculptures to minimalist paintings, this blog will
            inspire you to appreciate the beauty that lies in simplicity.
          </div>
        </div>
      </div>
      <div class="card-footer">Annie Spratt</div>
    </div>
  </body>
</html>
